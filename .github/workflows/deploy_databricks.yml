
name: Deploy Azure Databricks

on:
  push:
    branches:
      - main
    paths:
      - "proceso/**"
      - ".github/workflows/deploy_databricks.yml"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_AUTH_TYPE: pat

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validar configuracion
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "::error::Falta DATABRICKS_HOST"
            exit 1
          fi

          if [ -z "$DATABRICKS_TOKEN" ]; then
            echo "::error::Falta DATABRICKS_TOKEN"
            exit 1
          fi

          echo "Las variables de autenticacion estan configuradas."

      - name: Verificar conexion Databricks
        run: |
          databricks current-user me

      - name: Desplegar notebooks a Databricks
        run: |
          databricks workspace mkdirs \
            /Shared/DataSet_Automoviles_y_Peliculas

          for file in proceso/*.py; do
            name=$(basename "$file" .py)

            databricks workspace import \
              "/Shared/DataSet_Automoviles_y_Peliculas/$name" \
              --file "$file" \
              --language PYTHON \
              --format SOURCE \
              --overwrite
          done
